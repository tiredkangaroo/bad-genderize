name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build & test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke:
    name: Run server smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bad-genderize:ci

      - name: Run and verify
        run: |
          docker run -d --name gender-api -p 8081:8081 \
            -e HTTP_ADDR=:8081 \
            -e LLM_PROXY_URL=http://localhost:8080/v1 \
            bad-genderize:ci

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/healthz >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "server did not become healthy"
            docker logs gender-api
            exit 1
          fi

          echo "health: $(curl -fsS http://localhost:8081/healthz)"

          code=$(curl -sS -o /dev/null -w '%{http_code}' 'http://localhost:8081/api/v1/gender')
          if [ "$code" != "400" ]; then
            echo "expected 400 for missing name, got $code"
            exit 1
          fi
          echo "routing check: missing name -> $code"

          docker logs gender-api
