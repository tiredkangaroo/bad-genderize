name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Build & test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  docker:
    name: Build & run (Docker)
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bad-genderize:ci

      - name: Run the server and smoke test
        run: |
          docker run -d --name gender-api --network host \
            -e HTTP_ADDR=:8081 \
            -e REDIS_ADDR=localhost:6379 \
            -e LLM_PROXY_URL=http://localhost:8080/v1 \
            bad-genderize:ci

          # Wait for the liveness probe to pass.
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/healthz >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "server did not become healthy"
            docker logs gender-api
            exit 1
          fi

          echo "health: $(curl -fsS http://localhost:8081/healthz)"

          # Missing name must yield HTTP 400.
          code=$(curl -sS -o /dev/null -w '%{http_code}' 'http://localhost:8081/api/v1/gender')
          if [ "$code" != "400" ]; then
            echo "expected 400 for missing name, got $code"
            exit 1
          fi
          echo "routing check: missing name -> $code"

          docker logs gender-api
