services:
  redis:
    image: redis:7-alpine
    # Set REDIS_PASSWORD in your .env to enable auth on both sides.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8081:8081"
    environment:
      HTTP_ADDR: ":8081"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis}"
      # The LLM proxy runs on the host, so reach it via the Docker host alias.
      LLM_PROXY_URL: "${LLM_PROXY_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    depends_on:
      - redis
